services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app_db_local_user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app_db_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_db_local_user -d app_db_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
